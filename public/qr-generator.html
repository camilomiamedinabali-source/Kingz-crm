<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 90%;
    }
    h1 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #5568d3;
    }
    .qr-container {
      text-align: center;
      margin-top: 30px;
      display: none;
    }
    .qr-container.show {
      display: block;
    }
    #qrcode {
      margin: 20px auto;
    }
    .url-display {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      word-break: break-all;
      font-size: 12px;
      color: #666;
      margin-bottom: 15px;
    }
    .button-group {
      display: flex;
      gap: 10px;
    }
    .button-group button {
      flex: 1;
    }
    .btn-secondary {
      background: #888;
    }
    .btn-secondary:hover {
      background: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 QR Code Generator</h1>

    <div class="form-group">
      <label for="urlInput">Enter URL or Session ID:</label>
      <input
        type="text"
        id="urlInput"
        placeholder="e.g., https://kingz-crm.railway.app/remote/abc123 or just abc123"
        value=""
      >
    </div>

    <button onclick="generateQR()">Generate QR Code</button>

    <div class="qr-container" id="qrContainer">
      <div class="url-display" id="urlDisplay"></div>
      <div id="qrcode"></div>
      <div class="button-group">
        <button onclick="downloadQR()">Download</button>
        <button class="btn-secondary" onclick="copyUrl()">Copy URL</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    function generateQR() {
      const input = document.getElementById('urlInput').value.trim();
      if (!input) {
        alert('Please enter a URL or session ID');
        return;
      }

      // Build full URL
      let url = input;
      if (!input.startsWith('http')) {
        // Assume it's just a session ID
        const baseUrl = window.location.origin;
        url = `${baseUrl}/remote/${input}`;
      }

      // Clear previous QR
      document.getElementById('qrcode').innerHTML = '';

      // Generate new QR
      new QRCode(document.getElementById('qrcode'), {
        text: url,
        width: 300,
        height: 300,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      // Show container and URL
      document.getElementById('urlDisplay').textContent = url;
      document.getElementById('qrContainer').classList.add('show');

      // Focus input for easy re-use
      document.getElementById('urlInput').focus();
      document.getElementById('urlInput').select();
    }

    function downloadQR() {
      const canvas = document.querySelector('#qrcode canvas');
      if (!canvas) return;

      const link = document.createElement('a');
      link.href = canvas.toDataURL();
      link.download = 'remote-control-qr.png';
      link.click();
    }

    function copyUrl() {
      const url = document.getElementById('urlDisplay').textContent;
      navigator.clipboard.writeText(url).then(() => {
        alert('URL copied to clipboard!');
      });
    }

    // Allow Enter key
    document.getElementById('urlInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') generateQR();
    });

    // Generate immediately if URL has session ID in query param
    const params = new URLSearchParams(window.location.search);
    if (params.has('id')) {
      document.getElementById('urlInput').value = params.get('id');
      generateQR();
    }
  </script>
</body>
</html>
