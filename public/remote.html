<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Control</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .session-info {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 30px;
    }
    .messages {
      background: #222;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      min-height: 200px;
      max-height: 300px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
    }
    .message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 6px;
      background: #2a2a2a;
    }
    .message.phone {
      background: #1a3a1a;
      border-left: 3px solid #4CAF50;
    }
    .message.desktop {
      background: #3a1a1a;
      border-left: 3px solid #ff6b6b;
    }
    .empty-state {
      text-align: center;
      color: #666;
      padding: 40px 20px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      padding: 15px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #4CAF50;
      color: white;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-primary.recording {
      background: #ff6b6b;
      animation: pulse 0.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .btn-secondary {
      background: #333;
      color: white;
    }
    input {
      padding: 12px;
      border: 1px solid #333;
      background: #222;
      color: white;
      border-radius: 6px;
      font-size: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    .row input {
      flex: 1;
    }
    .row button {
      flex: 0 0 auto;
    }
    .status {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎤 Remote Control</h1>
    <div class="session-info">
      Session: <code id="sessionCode">Loading...</code>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state">Ready to receive messages</div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="voiceBtn">🎤 Speak</button>
      <div class="row">
        <input type="text" id="textInput" placeholder="Or type..." />
        <button class="btn-secondary" id="sendBtn">Send</button>
      </div>
    </div>

    <div class="status" id="status">Connecting...</div>
  </div>

  <script>
    const sessionId = window.location.pathname.split('/')[2] || 'demo';
    const voiceBtn = document.getElementById('voiceBtn');
    const sendBtn = document.getElementById('sendBtn');
    const textInput = document.getElementById('textInput');
    const messagesDiv = document.getElementById('messages');
    const statusDiv = document.getElementById('status');
    const sessionCode = document.getElementById('sessionCode');

    sessionCode.textContent = sessionId.substring(0, 8).toUpperCase();

    let recognition = null;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        voiceBtn.classList.add('recording');
        voiceBtn.textContent = '🔴 Listening...';
      };

      recognition.onend = () => {
        voiceBtn.classList.remove('recording');
        voiceBtn.textContent = '🎤 Speak';
      };

      recognition.onresult = (e) => {
        let text = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          text += e.results[i][0].transcript;
          if (e.results[i].isFinal) {
            sendMessage(text);
          }
        }
      };

      recognition.onerror = (e) => {
        statusDiv.textContent = `Error: ${e.error}`;
      };
    } else {
      voiceBtn.disabled = true;
      voiceBtn.textContent = '🎤 Not supported';
    }

    voiceBtn.onclick = () => {
      if (!recognition) return;
      if (voiceBtn.classList.contains('recording')) {
        recognition.stop();
      } else {
        recognition.start();
      }
    };

    sendBtn.onclick = () => {
      const text = textInput.value.trim();
      if (text) {
        sendMessage(text);
        textInput.value = '';
      }
    };

    textInput.onkeypress = (e) => {
      if (e.key === 'Enter') sendBtn.click();
    };

    function sendMessage(text) {
      fetch(`/api/remote/send-message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, message: text, type: 'text' })
      })
        .then(() => {
          addMessage(text, 'phone');
          statusDiv.textContent = 'Message sent ✓';
        })
        .catch(() => {
          statusDiv.textContent = 'Error sending message';
        });
    }

    function addMessage(text, from) {
      if (messagesDiv.querySelector('.empty-state')) {
        messagesDiv.innerHTML = '';
      }
      const div = document.createElement('div');
      div.className = `message ${from}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Poll for responses
    setInterval(() => {
      fetch(`/api/remote/responses/${sessionId}`)
        .then(r => r.json())
        .then(data => {
          if (data.response) {
            addMessage(data.response.message, 'desktop');
          }
          statusDiv.textContent = 'Connected ✓';
        })
        .catch(() => {
          statusDiv.textContent = 'Disconnected';
        });
    }, 500);
  </script>
</body>
</html>
