<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kingz CRM — Remote Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood: #2a1414;
      --wood-2: #3a1c1c;
      --maroon: #5c1a1a;
      --maroon-2: #7a2222;
      --gold: #c9a24b;
      --gold-soft: #e0c583;
      --gold-dim: #8a7233;
      --cream: #f4ead6;
      --cream-dim: #c9bda3;
      --ink: #1c0d0d;
      --good: #3f7d4e;
      --line: rgba(201, 162, 75, 0.22);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans);
      background: radial-gradient(1200px 600px at 50% -10%, #3a1c1c 0%, transparent 60%), linear-gradient(160deg, #241010 0%, #1c0d0d 100%);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .remote-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      padding: 0 16px;
    }

    header {
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    header h1 {
      font-family: var(--serif);
      font-size: 24px;
      margin: 0 0 6px;
      color: var(--gold-soft);
    }

    .session-id {
      font-size: 12px;
      color: var(--cream-dim);
      letter-spacing: 0.5px;
    }

    .session-id code {
      background: rgba(42, 20, 20, 0.5);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--gold);
      font-weight: 600;
    }

    .status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--good);
      margin-right: 6px;
      animation: pulse 2s ease-in-out infinite;
    }

    .status.offline {
      background: var(--cream-dim);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      background: linear-gradient(180deg, rgba(58, 28, 28, 0.75), rgba(42, 20, 20, 0.6));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .message.from-phone {
      border-color: var(--gold-dim);
      background: linear-gradient(180deg, rgba(122, 34, 34, 0.6), rgba(92, 26, 26, 0.5));
    }

    .message.from-desktop {
      border-color: var(--good);
      background: linear-gradient(180deg, rgba(63, 125, 78, 0.4), rgba(42, 60, 50, 0.3));
    }

    .message-header {
      font-size: 11px;
      color: var(--cream-dim);
      margin-bottom: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .message.from-desktop .message-header {
      color: var(--good);
    }

    .message-text {
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }

    .message-time {
      font-size: 10px;
      color: var(--cream-dim);
      margin-top: 6px;
      opacity: 0.7;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--cream-dim);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .controls {
      padding: 16px 0 20px;
      display: flex;
      gap: 12px;
      flex-direction: column;
    }

    .voice-button {
      background: linear-gradient(180deg, var(--gold-soft), var(--gold));
      color: #3a1414;
      border: none;
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      font-family: var(--sans);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 56px;
    }

    .voice-button:active {
      transform: translateY(1px);
    }

    .voice-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .voice-button.recording {
      background: linear-gradient(180deg, #e79a9a, #a23b3b);
      animation: recordingPulse 0.8s ease-in-out infinite;
    }

    @keyframes recordingPulse {
      0%, 100% { box-shadow: 0 4px 14px rgba(162, 59, 59, 0.3); }
      50% { box-shadow: 0 4px 20px rgba(162, 59, 59, 0.6); }
    }

    .voice-icon {
      width: 20px;
      height: 20px;
      display: inline-block;
    }

    .mic-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      margin: 0 4px;
      animation: micBounce 0.6s ease-in-out infinite;
    }

    .mic-dot:nth-child(2) {
      animation-delay: 0.1s;
    }

    .mic-dot:nth-child(3) {
      animation-delay: 0.2s;
    }

    @keyframes micBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .text-input-area {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #20100f;
      border: 1px solid var(--line);
      color: var(--cream);
      border-radius: 12px;
      padding: 13px 12px;
      font-size: 15px;
      font-family: var(--sans);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--gold);
    }

    .send-button {
      background: linear-gradient(180deg, var(--maroon-2), var(--maroon));
      color: var(--cream);
      border: 1px solid var(--gold-dim);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--sans);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      width: auto;
    }

    .send-button:active {
      transform: translateY(1px);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .transcript-preview {
      background: rgba(58, 28, 28, 0.6);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      font-style: italic;
      color: var(--cream-dim);
    }

    .transcript-preview.final {
      background: rgba(122, 34, 34, 0.4);
      color: var(--gold-soft);
      font-style: normal;
    }

    .error {
      background: rgba(162, 59, 59, 0.3);
      border: 1px solid rgba(162, 59, 59, 0.6);
      border-radius: 12px;
      padding: 12px;
      color: #e79a9a;
      font-size: 13px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="remote-container">
    <header>
      <h1>Remote Control</h1>
      <div class="session-id">
        <span class="status" id="statusLight"></span>
        Connected to <code id="sessionCode">Connecting...</code>
      </div>
    </header>

    <div id="errorContainer"></div>
    <div id="transcriptPreview"></div>

    <div class="messages" id="messages">
      <div class="empty">
        <div class="empty-icon">🎤</div>
        <div>Press the button below to start</div>
      </div>
    </div>

    <div class="controls">
      <button class="voice-button" id="voiceButton">
        <svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v12a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        Speak
      </button>

      <div class="text-input-area">
        <input type="text" id="textInput" placeholder="Or type a message..." />
        <button class="send-button" id="sendButton">Send</button>
      </div>
    </div>
  </div>

  <script>
    const sessionId = window.location.pathname.split('/')[2];
    let isRecording = false;
    let recognition = null;
    let messagesContainer = document.getElementById('messages');
    let voiceButton = document.getElementById('voiceButton');
    let sendButton = document.getElementById('sendButton');
    let textInput = document.getElementById('textInput');
    let sessionCode = document.getElementById('sessionCode');
    let statusLight = document.getElementById('statusLight');
    let errorContainer = document.getElementById('errorContainer');
    let transcriptPreview = document.getElementById('transcriptPreview');
    let pollInterval = null;

    // Initialize
    sessionCode.textContent = sessionId.substring(0, 8).toUpperCase();

    // Setup Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecording = true;
        voiceButton.classList.add('recording');
        voiceButton.innerHTML = '<span class="mic-dot"></span><span class="mic-dot"></span><span class="mic-dot"></span> Listening...';
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            sendMessage(transcript, 'voice');
          } else {
            interim += transcript;
          }
        }
        if (interim) {
          showTranscriptPreview(interim, false);
        }
      };

      recognition.onerror = (event) => {
        showError(`Voice input error: ${event.error}`);
        isRecording = false;
        voiceButton.classList.remove('recording');
        voiceButton.innerHTML = '<svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v12a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg> Speak';
      };

      recognition.onend = () => {
        isRecording = false;
        voiceButton.classList.remove('recording');
        voiceButton.innerHTML = '<svg class="voice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v12a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg> Speak';
      };
    } else {
      voiceButton.disabled = true;
      showError('Voice input not supported in your browser');
    }

    voiceButton.addEventListener('click', () => {
      if (!recognition) return;
      if (isRecording) {
        recognition.stop();
      } else {
        transcriptPreview.innerHTML = '';
        recognition.start();
      }
    });

    sendButton.addEventListener('click', () => {
      const text = textInput.value.trim();
      if (text) {
        sendMessage(text, 'text');
        textInput.value = '';
      }
    });

    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendButton.click();
      }
    });

    async function sendMessage(text, type) {
      try {
        const response = await fetch('/api/remote/send-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message: text, type })
        });

        if (!response.ok) {
          throw new Error('Failed to send message');
        }

        addMessageToUI(text, 'phone', type);
      } catch (err) {
        showError(err.message);
      }
    }

    function showTranscriptPreview(text, isFinal) {
      if (!text) {
        transcriptPreview.innerHTML = '';
        return;
      }
      transcriptPreview.className = `transcript-preview ${isFinal ? 'final' : ''}`;
      transcriptPreview.textContent = isFinal ? `Sent: "${text}"` : `Listening: "${text}..."`;
    }

    function showError(message) {
      const div = document.createElement('div');
      div.className = 'error';
      div.textContent = message;
      errorContainer.innerHTML = '';
      errorContainer.appendChild(div);
      setTimeout(() => errorContainer.innerHTML = '', 4000);
    }

    function addMessageToUI(text, from, type = 'text') {
      if (messagesContainer.querySelector('.empty')) {
        messagesContainer.innerHTML = '';
      }

      const div = document.createElement('div');
      div.className = `message from-${from}`;
      div.innerHTML = `
        <div class="message-header">${from === 'phone' ? 'You' : 'Desktop'}</div>
        <div class="message-text">${escapeHtml(text)}</div>
        <div class="message-time">${new Date().toLocaleTimeString()}</div>
      `;
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      showTranscriptPreview('', true);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Poll for responses from desktop
    function pollForResponses() {
      fetch(`/api/remote/responses/${sessionId}`)
        .then(r => r.json())
        .then(data => {
          if (data.response) {
            addMessageToUI(data.response.message, 'desktop');
          }
          statusLight.classList.remove('offline');
        })
        .catch(() => {
          statusLight.classList.add('offline');
        });
    }

    // Start polling every 500ms
    pollInterval = setInterval(pollForResponses, 500);

    // Initial status check
    pollForResponses();
  </script>
</body>
</html>
